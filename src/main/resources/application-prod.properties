spring.application.name=Team-IT

# Database Configuration (Environment Variables)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/teamit}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:ifhjMXWxZYqZ7vf2OLSfSoFo8GDpHe9meLFugKpDe1MSJD5pF3DtZ3kfhHsbhgtM}
jwt.expiration-access=${JWT_EXPIRATION_ACCESS:3600000}
jwt.expiration-refresh=${JWT_EXPIRATION_REFRESH:604800000}

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.TeamIT=INFO
logging.level.org.springframework.security=INFO
logging.level.root=INFO

# Spring Configuration
spring.main.allow-circular-references=true

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Production specific settings
spring.jpa.open-in-view=false