spring.application.name=Team-IT

# Database Configuration (Environment Variables)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/teamit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:ifhjMXWxZYqZ7vf2OLSfSoFo8GDpHe9meLFugKpDe1MSJD5pF3DtZ3kfhHsbhgtM}
jwt.expiration-access=${JWT_EXPIRATION_ACCESS:3600000}
jwt.expiration-refresh=${JWT_EXPIRATION_REFRESH:604800000}

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.TeamIT=INFO
logging.level.org.springframework.security=INFO
logging.level.root=INFO

# Spring Configuration
spring.main.allow-circular-references=true

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Production specific settings
spring.jpa.open-in-view=false