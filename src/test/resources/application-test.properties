# Test Configuration
spring.application.name=Team-IT

# H2 Database for Testing
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Test values)
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1naXRodWItYWN0aW9ucy10ZXN0aW5nLW1pbmltdW0tMjU2LWJpdHMtbG9uZy1zdHJpbmc=
jwt.expiration-access=3600000
jwt.expiration-refresh=604800000

# Disable OAuth2 for testing
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO

# Circular references
spring.main.allow-circular-references=true
