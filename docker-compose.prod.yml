version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: team-it-app:latest
    container_name: team-it-app
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Spring Boot Configuration
      SPRING_PROFILES_ACTIVE: prod

      # Database Configuration (AWS RDS MySQL)
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_URL: ${DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      # JPA Configuration
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-validate}
      SPRING_JPA_SHOW_SQL: false

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_ACCESS: ${JWT_EXPIRATION_ACCESS:-3600000}
      JWT_EXPIRATION_REFRESH: ${JWT_EXPIRATION_REFRESH:-604800000}

      # Server Configuration
      SERVER_PORT: 8080

      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_COM_TEAMIT: INFO

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - app-network

networks:
  app-network:
    driver: bridge
